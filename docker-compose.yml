version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "80"
    depends_on:
      - api
      - pocketbase
    restart: always
    networks:
      - avante-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
      # - ANTHROPIC_API_KEY=sua_chave_aqui (configurado no painel pb)
    depends_on:
      - pocketbase
    restart: always
    networks:
      - avante-network

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.38.0
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data"]
    restart: always
    networks:
      - avante-network

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public_media:/var/www/public_media
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - avante-network

  whatsapp-bot:
    build:
      context: ./apps/whatsapp-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - API_URL=http://api:3001
      - MEDIA_DIR=/var/www/public_media/imagens
    volumes:
      - ./public_media:/var/www/public_media
    networks:
      - avante-network
    depends_on:
      - api

networks:
  avante-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
