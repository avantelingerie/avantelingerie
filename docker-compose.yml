version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "80"
    depends_on:
      - api
      - pocketbase
    restart: always
    networks:
      - avante-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      # - ANTHROPIC_API_KEY=sua_chave_aqui (configurado no painel pb)
    depends_on:
      - pocketbase
    restart: always
    networks:
      - avante-network

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    command: ["serve", "--http=0.0.0.0:8090"]
    restart: always
    networks:
      - avante-network

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - avante-network

networks:
  avante-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
